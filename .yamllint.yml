extends: default

rules:
  line-length:
    max: 200          # compose files legitimately have long env-var lines
    level: warning
  document-start:
    present: false    # docker-compose files conventionally omit the --- marker
  commas:
    max-spaces-before: 0
    min-spaces-after: 0   # allow ["sh","-c"] style flow sequences with no space after comma
    max-spaces-after: -1
